<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Community - Infusion100</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1A1F36">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">Infusion<span class="accent">100</span></a>
    <button class="navbar-toggle" aria-label="Menu">&#9776;</button>
    <ul class="navbar-links" id="navLinks"></ul>
  </nav>

  <div class="container container-md">
    <div class="page-header">
      <h1>Community Feed</h1>
      <a href="/walk/log" class="btn btn-primary btn-sm" id="logWalkBtn" style="display:none">Log a Walk</a>
    </div>

    <div class="stats-grid" id="communityStats" style="margin-bottom:1.5rem">
      <div class="stat-card">
        <div class="stat-value" id="statWalkers">--</div>
        <div class="stat-label">Walkers</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statActivities">--</div>
        <div class="stat-label">Activities</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statDistance">--</div>
        <div class="stat-label">Total Distance</div>
      </div>
    </div>

    <div class="flex" style="justify-content:flex-end;align-items:center;gap:0.5rem;margin-bottom:0.75rem">
      <span class="text-muted" style="font-size:0.8rem" id="sortLabel">Activity date</span>
      <label class="toggle-switch">
        <input type="checkbox" id="sortToggle" onchange="toggleSort()">
        <span class="toggle-slider"></span>
      </label>
      <span class="text-muted" style="font-size:0.8rem" id="sortLabelRight">Upload date</span>
    </div>

    <div id="feed">
      <div class="loading-overlay"><span class="spinner"></span> Loading...</div>
    </div>

    <div id="loadMore" class="text-center mt-2 hidden">
      <button class="btn btn-outline" onclick="loadWalks()">Load More</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let nextCursor = null;
    let currentUser = null;
    let sortMode = 'date';

    async function init() {
      currentUser = await App.loadUser();
      if (currentUser) {
        document.getElementById('logWalkBtn').style.display = '';
      }
      // Community stats
      try {
        const s = await App.fetchJSON('/api/community-stats');
        document.getElementById('statWalkers').textContent = s.walkers;
        document.getElementById('statActivities').textContent = s.activities;
        document.getElementById('statDistance').textContent = App.formatDistance(s.total_km);
      } catch {}
      loadWalks();
    }

    function toggleSort() {
      sortMode = document.getElementById('sortToggle').checked ? 'upload' : 'date';
      nextCursor = null;
      document.getElementById('feed').innerHTML = '<div class="loading-overlay"><span class="spinner"></span> Loading...</div>';
      loadWalks();
    }

    async function loadWalks() {
      try {
        let url = `/api/walks?limit=15&sort=${sortMode}`;
        if (nextCursor) url += `&cursor=${nextCursor}`;

        const data = await App.fetchJSON(url);
        const feed = document.getElementById('feed');

        if (!nextCursor && data.walks.length === 0) {
          feed.innerHTML = '<p class="text-muted text-center mt-3">No walks yet. Be the first to log one!</p>';
          return;
        }

        if (!nextCursor) feed.innerHTML = '';

        data.walks.forEach(w => {
          feed.innerHTML += `
            <div class="walk-card">
              <div class="walk-card-header">
                ${App.renderAvatar(w)}
                <div class="walk-card-meta">
                  <div class="walk-card-name">${App.escapeHtml(w.full_name)}</div>
                  <div class="walk-card-date">${App.formatRelative(w.date)}</div>
                  <div class="walk-card-uploaded">uploaded ${App.formatRelative(w.created_at)}</div>
                </div>
                ${w.strava_id ? `<span class="badge badge-strava">${App.escapeHtml(w.activity_type || 'Strava')}</span>` : ''}
              </div>

              ${w.caption ? `<p class="walk-card-caption">${App.escapeHtml(w.caption)}</p>` : ''}
              ${w.description ? `<p class="walk-card-description" style="color:var(--text-muted);font-size:0.875rem;margin:0.25rem 0 0.5rem">${App.escapeHtml(w.description)}</p>` : ''}
              ${w.image_path ? `<img src="/${w.image_path}" alt="Walk photo" class="walk-card-image" loading="lazy">` : ''}

              <div class="walk-card-stats">
                <span><strong>${App.formatDistance(w.distance_km)}</strong></span>
                <span>${App.formatDuration(w.duration_mins)}</span>
                <span>${App.formatDate(w.date)}</span>
              </div>

              <div class="walk-card-actions">
                <button onclick="toggleLike(${w.id}, this)" class="${w.user_liked ? 'liked' : ''}">
                  ${w.user_liked ? '&#10084;' : '&#9825;'} <span>${w.like_count}</span>
                </button>
                <a href="/walk/${w.id}" style="color:var(--text-muted);font-size:0.875rem">
                  ${w.comment_count} comment(s)
                </a>
              </div>
            </div>
          `;
        });

        nextCursor = data.nextCursor;
        document.getElementById('loadMore').classList.toggle('hidden', !nextCursor);
      } catch (err) {
        document.getElementById('feed').innerHTML = '<div class="alert alert-danger">Failed to load feed.</div>';
      }
    }

    async function toggleLike(walkId, btn) {
      if (!currentUser) return window.location.href = '/login';
      try {
        const result = await App.fetchJSON(`/api/walks/${walkId}/like`, { method: 'POST' });
        btn.className = result.liked ? 'liked' : '';
        btn.innerHTML = `${result.liked ? '&#10084;' : '&#9825;'} <span>${result.count}</span>`;
      } catch {}
    }

    init();
  </script>
</body>
</html>
