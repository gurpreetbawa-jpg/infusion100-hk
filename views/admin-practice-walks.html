<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Practice Walks - Infusion100</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1A1F36">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">Infusion<span class="accent">100</span></a>
    <button class="navbar-toggle" aria-label="Menu">&#9776;</button>
    <ul class="navbar-links" id="navLinks"></ul>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>Practice Walks</h1>
      <button class="btn btn-primary" onclick="openModal()">New Practice Walk</button>
    </div>

    <div id="alertBox"></div>
    <div id="walksList">
      <div class="loading-overlay"><span class="spinner"></span> Loading...</div>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div class="modal-backdrop" id="walkModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">New Practice Walk</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="walkForm">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="walkTitleInput" class="form-control" required placeholder="e.g. Saturday morning walk">
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="walkDateInput" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Time (optional)</label>
          <input type="time" id="walkTimeInput" class="form-control">
        </div>
        <div class="form-group">
          <label>Participants <span id="selectedCount" class="text-muted text-sm">(0 selected)</span></label>
          <input type="text" id="participantSearch" class="form-control" placeholder="Search participants..." oninput="filterParticipants()">
          <div id="participantList" class="mt-1" style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:0.5rem;padding:0.5rem"></div>
        </div>
        <div class="flex gap-1">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let allParticipants = [];
    let selectedIds = new Set();

    async function init() {
      await App.loadUser();
      // Load all participants for the selector
      try {
        const data = await App.fetchJSON('/admin/api/participants?limit=100');
        allParticipants = data.participants;
      } catch {}
      loadWalks();
    }

    async function loadWalks() {
      try {
        const { practice_walks } = await App.fetchJSON('/admin/api/practice-walks');
        const container = document.getElementById('walksList');
        if (practice_walks.length === 0) {
          container.innerHTML = '<p class="text-muted">No practice walks scheduled yet.</p>';
          return;
        }
        container.innerHTML = practice_walks.map(w => {
          const date = new Date(w.walk_date).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
          const time = w.walk_time ? w.walk_time.substring(0, 5) : '';
          return `
            <div class="card" style="margin-bottom:1rem">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:0.5rem">
                <div>
                  <strong style="font-size:1.125rem">${App.escapeHtml(w.title)}</strong>
                  <div class="text-muted text-sm mt-1">${date}${time ? ' at ' + time : ''}</div>
                  <div class="text-sm mt-1">${w.participant_count} participant${w.participant_count != 1 ? 's' : ''}</div>
                </div>
                <div style="display:flex;gap:0.5rem">
                  <button class="btn btn-outline btn-sm" onclick="editWalk(${w.id})">Edit</button>
                  <button class="btn btn-outline btn-sm" style="color:var(--danger)" onclick="deleteWalk(${w.id})">Delete</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        document.getElementById('walksList').innerHTML = '<p class="text-muted">Failed to load practice walks.</p>';
      }
    }

    function renderParticipantList() {
      const search = document.getElementById('participantSearch').value.toLowerCase();
      const filtered = allParticipants.filter(p =>
        (p.full_name || '').toLowerCase().includes(search) || (p.email || '').toLowerCase().includes(search)
      );
      const container = document.getElementById('participantList');
      container.innerHTML = filtered.map(p => `
        <label style="display:flex;align-items:center;gap:0.5rem;padding:0.375rem 0;cursor:pointer;border-bottom:1px solid var(--border)">
          <input type="checkbox" value="${p.id}" ${selectedIds.has(p.id) ? 'checked' : ''} onchange="toggleParticipant(${p.id}, this.checked)">
          <span class="text-sm">${App.escapeHtml(p.full_name || p.email)}</span>
          <span class="text-muted text-sm" style="margin-left:auto">${App.escapeHtml(p.email)}</span>
        </label>
      `).join('');
      document.getElementById('selectedCount').textContent = `(${selectedIds.size} selected)`;
    }

    function filterParticipants() {
      renderParticipantList();
    }

    function toggleParticipant(id, checked) {
      if (checked) selectedIds.add(id);
      else selectedIds.delete(id);
      document.getElementById('selectedCount').textContent = `(${selectedIds.size} selected)`;
    }

    function openModal(data) {
      document.getElementById('editId').value = data?.id || '';
      document.getElementById('modalTitle').textContent = data ? 'Edit Practice Walk' : 'New Practice Walk';
      document.getElementById('walkTitleInput').value = data?.title || '';
      document.getElementById('walkDateInput').value = data?.walk_date ? data.walk_date.split('T')[0] : '';
      document.getElementById('walkTimeInput').value = data?.walk_time ? data.walk_time.substring(0, 5) : '';
      selectedIds = new Set((data?.participants || []).map(p => p.id));
      document.getElementById('participantSearch').value = '';
      renderParticipantList();
      document.getElementById('walkModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('walkModal').classList.remove('active');
    }

    async function editWalk(id) {
      try {
        const data = await App.fetchJSON(`/admin/api/practice-walks/${id}`);
        openModal(data);
      } catch (err) {
        App.showAlert(document.getElementById('alertBox'), 'Failed to load walk: ' + err.message, 'danger');
      }
    }

    async function deleteWalk(id) {
      if (!confirm('Delete this practice walk?')) return;
      try {
        await App.fetchJSON(`/admin/api/practice-walks/${id}`, { method: 'DELETE' });
        App.showAlert(document.getElementById('alertBox'), 'Practice walk deleted', 'success');
        loadWalks();
      } catch (err) {
        App.showAlert(document.getElementById('alertBox'), 'Delete failed: ' + err.message, 'danger');
      }
    }

    document.getElementById('walkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const payload = {
        title: document.getElementById('walkTitleInput').value.trim(),
        walk_date: document.getElementById('walkDateInput').value,
        walk_time: document.getElementById('walkTimeInput').value || null,
        participant_ids: [...selectedIds],
      };
      try {
        if (id) {
          await App.fetchJSON(`/admin/api/practice-walks/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
        } else {
          await App.fetchJSON('/admin/api/practice-walks', { method: 'POST', body: JSON.stringify(payload) });
        }
        closeModal();
        App.showAlert(document.getElementById('alertBox'), id ? 'Practice walk updated' : 'Practice walk created', 'success');
        loadWalks();
      } catch (err) {
        App.showAlert(document.getElementById('alertBox'), 'Save failed: ' + err.message, 'danger');
      }
    });

    init();
  </script>
</body>
</html>
