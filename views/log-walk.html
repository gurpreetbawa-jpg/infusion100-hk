<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Log a Walk - Infusion100</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1A1F36">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">Infusion<span class="accent">100</span></a>
    <button class="navbar-toggle" aria-label="Menu">&#9776;</button>
    <ul class="navbar-links" id="navLinks"></ul>
  </nav>

  <div class="container container-sm">
    <div class="card">
      <h1 style="font-size:1.5rem; margin-bottom:1rem">Log a Practice Walk</h1>
      <div id="alertBox"></div>

      <form id="walkForm">
        <div class="form-group">
          <label for="date">Date *</label>
          <div class="flex gap-1">
            <input type="date" id="date" class="form-control" required style="flex:1">
            <input type="time" id="time" class="form-control" style="flex:1">
          </div>
        </div>

        <div class="form-group">
          <label>Distance *</label>
          <div class="flex gap-1" style="align-items:center">
            <input type="number" id="distance" class="form-control" step="any" min="0" inputmode="decimal" required style="flex:1">
            <div class="toggle-group">
              <button type="button" class="active" data-unit="km" onclick="setUnit('km')">km</button>
              <button type="button" data-unit="miles" onclick="setUnit('miles')">miles</button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Duration</label>
          <div class="flex gap-1">
            <input type="number" id="durationHours" class="form-control" min="0" max="23" inputmode="numeric" placeholder="Hours" style="flex:1">
            <input type="number" id="durationMins" class="form-control" min="0" max="59" inputmode="numeric" placeholder="Minutes" style="flex:1">
          </div>
        </div>

        <div class="form-group">
          <label for="caption">Caption</label>
          <input type="text" id="caption" class="form-control" placeholder="e.g. Scenic walk along the Lantau coast" maxlength="200">
        </div>

        <div class="form-group" style="position:relative">
          <label for="description">Description (optional)</label>
          <textarea id="description" class="form-control" rows="3" placeholder="Any extra details about your walk... Use @ to mention people"></textarea>
          <div id="mentionDropdown" class="mention-dropdown hidden"></div>
        </div>

        <div class="form-group">
          <label for="image">Photo (optional)</label>
          <input type="file" id="image" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" class="form-control">
          <p class="form-hint">Upload a photo from your walk. It will be compressed automatically.</p>
        </div>

        <img id="imagePreview" class="walk-card-image hidden" alt="Preview">

        <div class="form-group">
          <label for="gpx">GPX File (optional)</label>
          <input type="file" id="gpx" accept=".gpx,application/gpx+xml,text/xml,application/xml" class="form-control">
          <p class="form-hint">Upload a GPX file to show your route on a map.</p>
        </div>

        <div id="gpxMap" class="map-container hidden" style="height:250px; margin-bottom:1rem"></div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="submitBtn">
          Save Walk
        </button>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let followedUsers = [];
    let mentions = [];
    let activeDropdownIndex = -1;

    App.loadUser().then(user => {
      if (user) {
        App.fetchJSON('/api/follows').then(data => {
          followedUsers = data.following || [];
        }).catch(() => {});
      }
    });

    let unit = 'km';
    let gpxMap;

    const now = new Date();
    const dateInput = document.getElementById('date');
    dateInput.value = App.localDateStr(now);
    dateInput.max = App.localDateStr(now);
    document.getElementById('time').value = App.localTimeStr(now);

    function setUnit(u) {
      unit = u;
      document.querySelectorAll('.toggle-group button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.unit === u);
      });
    }

    // Image preview
    document.getElementById('image').addEventListener('change', (e) => {
      const file = e.target.files[0];
      const preview = document.getElementById('imagePreview');
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          preview.src = ev.target.result;
          preview.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      } else {
        preview.classList.add('hidden');
        preview.src = '';
      }
    });

    // GPX preview
    document.getElementById('gpx').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parser = new DOMParser();
          const doc = parser.parseFromString(ev.target.result, 'text/xml');
          const points = doc.querySelectorAll('trkpt');
          if (points.length === 0) return;

          const coords = Array.from(points).map(pt => [
            parseFloat(pt.getAttribute('lat')),
            parseFloat(pt.getAttribute('lon'))
          ]);

          const mapEl = document.getElementById('gpxMap');
          mapEl.classList.remove('hidden');

          if (!gpxMap) {
            gpxMap = L.map('gpxMap');
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '&copy; OpenStreetMap'
            }).addTo(gpxMap);
          }

          gpxMap.eachLayer(l => { if (l instanceof L.Polyline) gpxMap.removeLayer(l); });
          const line = L.polyline(coords, { color: '#FC4C02', weight: 3 }).addTo(gpxMap);
          gpxMap.fitBounds(line.getBounds(), { padding: [20, 20] });
        } catch {}
      };
      reader.readAsText(file);
    });

    // --- Mention autocomplete ---
    const descEl = document.getElementById('description');
    const dropdown = document.getElementById('mentionDropdown');

    function getMentionQuery() {
      const val = descEl.value;
      const pos = descEl.selectionStart;
      // Scan backwards from cursor to find @ preceded by start or whitespace
      let i = pos - 1;
      while (i >= 0 && val[i] !== '@' && val[i] !== '\n') i--;
      if (i < 0 || val[i] !== '@') return null;
      // @ must be at start or preceded by whitespace
      if (i > 0 && !/\s/.test(val[i - 1])) return null;
      return { start: i, query: val.substring(i + 1, pos) };
    }

    function showDropdown(matches) {
      if (matches.length === 0) { hideDropdown(); return; }
      activeDropdownIndex = 0;
      dropdown.innerHTML = matches.map((u, idx) =>
        `<div class="mention-item${idx === 0 ? ' active' : ''}" data-id="${u.id}" data-name="${App.escapeHtml(u.full_name)}">
          ${App.renderAvatar(u, 'sm')}
          <span>${App.escapeHtml(u.full_name)}</span>
        </div>`
      ).join('');
      dropdown.classList.remove('hidden');
    }

    function hideDropdown() {
      dropdown.classList.add('hidden');
      activeDropdownIndex = -1;
    }

    function selectMention(id, name) {
      const mq = getMentionQuery();
      if (!mq) return;
      const before = descEl.value.substring(0, mq.start);
      const after = descEl.value.substring(descEl.selectionStart);
      descEl.value = before + '@' + name + ' ' + after;
      const newPos = mq.start + name.length + 2;
      descEl.setSelectionRange(newPos, newPos);
      descEl.focus();
      // Dedup
      if (!mentions.find(m => m.id === id)) {
        mentions.push({ id, name });
      }
      hideDropdown();
    }

    descEl.addEventListener('input', () => {
      if (followedUsers.length === 0) return;
      const mq = getMentionQuery();
      if (!mq) { hideDropdown(); return; }
      const q = mq.query.toLowerCase();
      const matches = followedUsers.filter(u =>
        u.full_name.toLowerCase().includes(q)
      ).slice(0, 8);
      showDropdown(matches);
    });

    descEl.addEventListener('keydown', (e) => {
      if (dropdown.classList.contains('hidden')) return;
      const items = dropdown.querySelectorAll('.mention-item');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeDropdownIndex = Math.min(activeDropdownIndex + 1, items.length - 1);
        items.forEach((el, i) => el.classList.toggle('active', i === activeDropdownIndex));
        items[activeDropdownIndex]?.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeDropdownIndex = Math.max(activeDropdownIndex - 1, 0);
        items.forEach((el, i) => el.classList.toggle('active', i === activeDropdownIndex));
        items[activeDropdownIndex]?.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter' || e.key === 'Tab') {
        if (activeDropdownIndex >= 0 && items[activeDropdownIndex]) {
          e.preventDefault();
          const el = items[activeDropdownIndex];
          selectMention(parseInt(el.dataset.id), el.dataset.name);
        }
      } else if (e.key === 'Escape') {
        hideDropdown();
      }
    });

    dropdown.addEventListener('mousedown', (e) => {
      const item = e.target.closest('.mention-item');
      if (item) {
        e.preventDefault();
        selectMention(parseInt(item.dataset.id), item.dataset.name);
      }
    });

    descEl.addEventListener('blur', () => {
      setTimeout(hideDropdown, 150);
    });

    document.getElementById('walkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;

      const imageFile = document.getElementById('image').files[0];
      const hasImage = !!imageFile;

      // Note: innerHTML here uses only static markup (no user data), safe from XSS
      if (hasImage) {
        btn.innerHTML = '<div class="upload-progress"><span class="upload-progress-text">Uploading... 0%</span><div class="upload-progress-bar"><div class="upload-progress-bar-fill" id="uploadFill"></div></div></div>';
      } else {
        btn.innerHTML = '<span class="spinner"></span> Saving...';
      }

      try {
        let distKm = parseFloat(document.getElementById('distance').value);
        if (unit === 'miles') distKm = distKm * 1.60934;

        const dateVal = document.getElementById('date').value;
        const timeVal = document.getElementById('time').value;
        const fullDate = App.appendTzOffset(timeVal ? `${dateVal}T${timeVal}` : `${dateVal}T00:00`);

        const formData = new FormData();
        formData.append('date', fullDate);
        formData.append('distance_km', distKm.toFixed(2));
        const dh = parseInt(document.getElementById('durationHours').value) || 0;
        const dm = parseInt(document.getElementById('durationMins').value) || 0;
        formData.append('duration_mins', (dh || dm) ? dh * 60 + dm : '');
        formData.append('caption', document.getElementById('caption').value);
        formData.append('description', document.getElementById('description').value);
        if (mentions.length > 0) {
          formData.append('mentions', JSON.stringify(mentions));
        }

        if (imageFile) {
          formData.append('image', imageFile);
        }

        const gpxFile = document.getElementById('gpx').files[0];
        if (gpxFile) {
          if (!gpxFile.name.toLowerCase().endsWith('.gpx')) {
            throw new Error('Only GPX files are allowed. Please select a .gpx file.');
          }
          formData.append('gpx', gpxFile);
        }

        const walk = await App.uploadFormData('/api/walks', 'POST', formData, {
          onProgress: (pct) => {
            if (!hasImage) return;
            const fill = document.getElementById('uploadFill');
            const text = btn.querySelector('.upload-progress-text');
            if (fill) fill.style.width = pct + '%';
            if (text) text.textContent = pct < 100 ? 'Uploading... ' + pct + '%' : 'Processing...';
            if (pct >= 100) {
              // Note: static markup only, no user data
              btn.innerHTML = '<span class="spinner"></span> Processing image...';
            }
          },
        });
        window.location.href = '/walk/' + walk.id;
      } catch (err) {
        App.showAlert(document.getElementById('alertBox'), err.message, 'danger');
        btn.disabled = false;
        btn.textContent = 'Save Walk';
      }
    });
  </script>
</body>
</html>
