<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Walk Details - Infusion100</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1A1F36">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">Infusion<span class="accent">100</span></a>
    <button class="navbar-toggle" aria-label="Menu">&#9776;</button>
    <ul class="navbar-links" id="navLinks"></ul>
  </nav>

  <div class="container container-md">
    <div id="walkContent">
      <div class="loading-overlay"><span class="spinner"></span> Loading walk...</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/app.js"></script>
  <script>
    const walkId = window.location.pathname.split('/').pop();

    async function loadWalk() {
      try {
        const walk = await App.fetchJSON(`/api/walks/${walkId}`);
        const user = await App.loadUser();

        document.getElementById('walkContent').innerHTML = `
          <div class="walk-card">
            <div class="walk-card-header">
              ${App.renderAvatar(walk)}
              <div class="walk-card-meta">
                <div class="walk-card-name">${App.escapeHtml(walk.full_name)}</div>
                <div class="walk-card-date">${App.formatDateTime(walk.date)}</div>
              </div>
              ${walk.strava_id ? `<span class="badge badge-strava">${App.escapeHtml(walk.activity_type || 'Strava')}</span>
                <a href="https://www.strava.com/activities/${walk.strava_id}" target="_blank" rel="noopener" class="strava-link">View on Strava</a>
                <img src="/icons/powered-by-strava.svg" alt="Powered by Strava" style="height:24px">` : ''}
              ${user && user.id !== walk.participant_id ? `<button class="btn-follow${walk.user_following ? ' following' : ''}" data-follow-id="${walk.participant_id}" onclick="toggleFollow(${walk.participant_id}, this)">${walk.user_following ? 'Following' : 'Follow'}</button>` : ''}
            </div>

            ${user && user.id === walk.participant_id ? `
              <div class="flex gap-1 mb-1" id="ownerActions">
                <button class="btn btn-outline btn-sm" onclick="showEditForm()">Edit</button>
                <button class="btn btn-outline btn-sm" style="color:var(--danger)" onclick="deleteWalk()">Delete</button>
              </div>
              <form id="editWalkForm" class="hidden mb-1">
                <div class="form-group">
                  <label>Date</label>
                  <div class="flex gap-1">
                    <input type="date" id="editDate" class="form-control" value="${walk.date?.split('T')[0] || ''}" max="${new Date().toISOString().split('T')[0]}" required style="flex:1">
                    <input type="time" id="editTime" class="form-control" value="${walk.date ? new Date(walk.date).toTimeString().slice(0, 5) : ''}" style="flex:1">
                  </div>
                </div>
                <div class="form-group">
                  <label>Distance (km)</label>
                  <input type="number" id="editDistance" class="form-control" step="any" min="0" inputmode="decimal" value="${walk.distance_km}" required>
                </div>
                <div class="form-group">
                  <label>Duration (minutes)</label>
                  <input type="number" id="editDuration" class="form-control" min="0" inputmode="numeric" value="${walk.duration_mins || ''}">
                </div>
                <div class="form-group">
                  <label>Caption</label>
                  <input type="text" id="editCaption" class="form-control" maxlength="200" value="${App.escapeHtml(walk.caption || '')}">
                </div>
                <div class="form-group">
                  <label>Description</label>
                  <textarea id="editDescription" class="form-control" rows="3">${App.escapeHtml(walk.description || '')}</textarea>
                </div>
                <div class="form-group">
                  <label>Photo</label>
                  ${walk.image_path ? `<img src="/${walk.image_path}" alt="Current photo" style="max-width:200px;border-radius:8px;margin-bottom:0.5rem;display:block">` : ''}
                  <input type="file" id="editImage" class="form-control" accept="image/jpeg,image/png,image/webp,image/heic,image/heif">
                </div>
                <div class="flex gap-1">
                  <button type="submit" class="btn btn-primary btn-sm">Save</button>
                  <button type="button" class="btn btn-outline btn-sm" onclick="hideEditForm()">Cancel</button>
                </div>
              </form>
            ` : ''}

            ${walk.caption ? `<p class="walk-card-caption">${App.renderMentions(App.escapeHtml(walk.caption), walk.mentions)}</p>` : ''}
            ${walk.description ? `<p class="walk-card-description" style="color:var(--text-muted);font-size:0.875rem;margin:0.25rem 0 0.5rem">${App.renderMentions(App.escapeHtml(walk.description), walk.mentions)}</p>` : ''}
            ${walk.image_path ? `<img src="/${walk.image_path}" alt="Walk photo" class="walk-card-image" loading="lazy">` : ''}

            <div class="walk-card-stats">
              <span><strong>${App.formatDistance(walk.distance_km)}</strong></span>
              <span>${App.formatDuration(walk.duration_mins)}</span>
            </div>

            ${walk.polyline ? `<div id="walkMap" class="walk-card-map" style="cursor:pointer;position:relative" onclick="openFullMap()">
              <div style="position:absolute;top:8px;right:8px;z-index:400;background:rgba(255,255,255,0.85);border-radius:4px;padding:2px 6px;font-size:1rem;line-height:1;pointer-events:none">&#x26F6;</div>
            </div>` : ''}

            <div id="mapOverlay" class="map-overlay hidden" onclick="closeFullMap(event)">
              <button class="map-overlay-close" onclick="closeFullMap()">&times;</button>
              <div id="fullMap" class="map-overlay-map"></div>
            </div>

            <div class="walk-card-actions">
              <button onclick="toggleLike()" id="likeBtn" class="${walk.user_liked ? 'liked' : ''}">
                ${walk.user_liked ? '&#10084;' : '&#9825;'} <span id="likeCount">${walk.like_count}</span>
              </button>
              <span class="text-muted" style="font-size:0.875rem">${walk.comments?.length || 0} comment(s)</span>
            </div>
            ${parseInt(walk.like_count) > 0 ? `
            <div class="likes-summary" id="likesSummary">
              <div class="avatar-pile">
                ${walk.recent_likers.map(l => App.renderAvatar(l, 'xs')).join('')}
              </div>
              <div class="likes-summary-text">${buildLikerText(walk.recent_likers, parseInt(walk.like_count))}</div>
            </div>` : ''}

            <div class="comments-section">
              <div id="commentsList">
                ${(walk.comments || []).map(c => renderComment(c)).join('')}
              </div>
              ${user ? `
                <form class="comment-form" onsubmit="postComment(event)">
                  <input type="text" id="commentInput" placeholder="Write a comment..." required>
                  <button type="submit" class="btn btn-primary btn-sm">Post</button>
                </form>
              ` : '<p class="text-muted mt-1" style="font-size:0.875rem"><a href="/login">Log in</a> to comment.</p>'}
            </div>
          </div>
        `;

        // Decode polyline and show map
        if (walk.polyline) {
          window._polylineData = walk.polyline;
          const map = L.map('walkMap', { zoomControl: false, dragging: false, scrollWheelZoom: false, touchZoom: false, doubleClickZoom: false });
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
          }).addTo(map);
          const coords = decodePolyline(walk.polyline);
          const line = L.polyline(coords, { color: '#FC4C02', weight: 3 }).addTo(map);
          map.fitBounds(line.getBounds(), { padding: [20, 20] });
        }
      } catch (err) {
        document.getElementById('walkContent').innerHTML = `<div class="alert alert-danger">Walk not found.</div>`;
      }
    }

    function renderComment(c) {
      return `
        <div class="comment">
          ${App.renderAvatar(c, 'sm')}
          <div class="comment-body">
            <div class="comment-name">${App.escapeHtml(c.full_name)}</div>
            <div class="comment-text">${App.escapeHtml(c.body)}</div>
            <div class="comment-time">${App.formatRelative(c.created_at)}</div>
          </div>
        </div>
      `;
    }

    async function toggleFollow(participantId, btn) {
      try {
        const result = await App.fetchJSON(`/api/follows/${participantId}`, { method: 'POST' });
        document.querySelectorAll(`[data-follow-id="${participantId}"]`).forEach(b => {
          b.className = 'btn-follow' + (result.following ? ' following' : '');
          b.textContent = result.following ? 'Following' : 'Follow';
        });
      } catch {}
    }

    function buildLikerText(likers, totalCount) {
      const names = likers.map(l => `<strong>${App.escapeHtml(l.full_name.split(' ')[0])}</strong>`);
      if (totalCount === 1) return `Liked by ${names[0]}`;
      if (totalCount === 2) return `Liked by ${names[0]} and ${names[1]}`;
      const others = totalCount - names.length;
      if (others > 0) return `Liked by ${names.join(', ')}, and <strong>${others} other${others > 1 ? 's' : ''}</strong>`;
      return `Liked by ${names.slice(0, -1).join(', ')}, and ${names[names.length - 1]}`;
    }

    async function toggleLike() {
      try {
        const result = await App.fetchJSON(`/api/walks/${walkId}/like`, { method: 'POST' });
        const btn = document.getElementById('likeBtn');
        btn.className = result.liked ? 'liked' : '';
        btn.innerHTML = `${result.liked ? '&#10084;' : '&#9825;'} <span id="likeCount">${result.count}</span>`;

        const existing = document.getElementById('likesSummary');
        if (result.count === 0) {
          if (existing) existing.remove();
          return;
        }

        const data = await App.fetchJSON(`/api/walks/${walkId}/likes`);
        const likers = data.likes.slice(0, 3);
        const html = `
          <div class="likes-summary" id="likesSummary">
            <div class="avatar-pile">
              ${likers.map(l => App.renderAvatar(l, 'xs')).join('')}
            </div>
            <div class="likes-summary-text">${buildLikerText(likers, result.count)}</div>
          </div>`;

        if (existing) {
          existing.outerHTML = html;
        } else {
          document.querySelector('.walk-card-actions').insertAdjacentHTML('afterend', html);
        }
      } catch {}
    }

    async function postComment(e) {
      e.preventDefault();
      const input = document.getElementById('commentInput');
      const body = input.value.trim();
      if (!body) return;

      try {
        const comment = await App.fetchJSON(`/api/walks/${walkId}/comments`, {
          method: 'POST',
          body: JSON.stringify({ body }),
        });
        document.getElementById('commentsList').innerHTML += renderComment(comment);
        input.value = '';
      } catch {}
    }

    function showEditForm() {
      document.getElementById('editWalkForm').classList.remove('hidden');
      document.getElementById('ownerActions').classList.add('hidden');
      document.getElementById('editWalkForm').addEventListener('submit', saveEdit);
    }

    function hideEditForm() {
      document.getElementById('editWalkForm').classList.add('hidden');
      document.getElementById('ownerActions').classList.remove('hidden');
    }

    async function saveEdit(e) {
      e.preventDefault();
      try {
        const dateVal = document.getElementById('editDate').value;
        const timeVal = document.getElementById('editTime').value;
        const fullDate = timeVal ? `${dateVal}T${timeVal}` : dateVal;

        const form = new FormData();
        form.append('date', fullDate);
        form.append('distance_km', document.getElementById('editDistance').value);
        form.append('duration_mins', document.getElementById('editDuration').value || '');
        form.append('caption', document.getElementById('editCaption').value);
        form.append('description', document.getElementById('editDescription').value);
        const imageFile = document.getElementById('editImage').files[0];
        if (imageFile) form.append('image', imageFile);

        const res = await fetch(`/api/walks/${walkId}`, { method: 'PUT', body: form });
        if (res.status === 401) { window.location.href = '/login'; return; }
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Request failed');
        }
        loadWalk();
      } catch (err) {
        alert('Failed to update: ' + err.message);
      }
    }

    async function deleteWalk() {
      if (!confirm('Delete this activity? This cannot be undone.')) return;
      try {
        await App.fetchJSON(`/api/walks/${walkId}`, { method: 'DELETE' });
        window.location.href = '/dashboard';
      } catch (err) {
        alert('Failed to delete: ' + err.message);
      }
    }

    let _fullMap = null;

    function openFullMap() {
      if (!window._polylineData) return;
      const overlay = document.getElementById('mapOverlay');
      overlay.classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      setTimeout(() => {
        _fullMap = L.map('fullMap');
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap'
        }).addTo(_fullMap);
        const coords = decodePolyline(window._polylineData);
        const line = L.polyline(coords, { color: '#FC4C02', weight: 3 }).addTo(_fullMap);
        _fullMap.fitBounds(line.getBounds(), { padding: [30, 30] });
      }, 50);
    }

    function closeFullMap(e) {
      if (e && e.target !== e.currentTarget && !e.target.classList.contains('map-overlay-close')) return;
      document.getElementById('mapOverlay').classList.add('hidden');
      document.body.style.overflow = '';
      if (_fullMap) { _fullMap.remove(); _fullMap = null; }
    }

    // Decode Google polyline encoding
    function decodePolyline(str) {
      const coords = [];
      let index = 0, lat = 0, lng = 0;
      while (index < str.length) {
        let shift = 0, result = 0, b;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        coords.push([lat / 1e5, lng / 1e5]);
      }
      return coords;
    }

    loadWalk();
  </script>
</body>
</html>
